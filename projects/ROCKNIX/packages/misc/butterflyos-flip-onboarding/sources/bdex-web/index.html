<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bdex collection</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script><body><header><div class="brand"><img class="brand-icon" src="/bdex.png" alt="Bdex collection device"><div><h1>Bdex</h1><p>Your Pokémon collection · Read only</p></div></div><nav><button data-gen="1">Gen 1</button><button data-gen="2">Gen 2</button><button data-gen="3">Gen 3</button><button id="refresh">Refresh</button></nav></header><main><section class="filters"><input id="search" placeholder="Search species or nickname" aria-label="Search"><select id="owned" aria-label="Collection filter"><option value="all">All species</option><option value="owned">Owned</option><option value="missing">Missing</option></select><select id="game" aria-label="Source game"><option value="">All source games</option></select><select id="special" aria-label="Special filter"><option value="">All copies</option><option value="shiny">Shiny</option><option value="egg">Eggs</option></select><select id="type" aria-label="Type filter"><option value="">All types</option></select></section><p id="status" role="status">Loading…</p><div id="species"></div><dialog id="detail"><button id="close">Close</button><div id="content"></div></dialog><footer>Imported-from badges describe the source save. Manage your collection on the device.</footer></main></body></html>
