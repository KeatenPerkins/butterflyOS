<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10d9ff"/>
      <stop offset=".52" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#ff3fa4"/>
    </linearGradient>
  </defs>
  <!-- Keep Settings in the same card language as the other home destinations. -->
  <rect x="8" y="8" width="304" height="464" rx="24" fill="#090d20" stroke="url(#edge)" stroke-width="8"/>
  <image href="settings.png" x="28" y="42" width="264" height="290" preserveAspectRatio="xMidYMid meet"/>
  <rect x="28" y="362" width="264" height="86" rx="14" fill="#121a36" stroke="#304565" stroke-width="4"/>
  <text x="160" y="418" text-anchor="middle" fill="#fff" font-family="Liberation Sans, sans-serif" font-size="40" font-weight="700">Settings</text>
</svg>
