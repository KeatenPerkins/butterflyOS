# IP/DHCP is handled by NetworkManager; iwd only does 802.11 + WPA.
[General]
EnableNetworkConfiguration=false
ControlPortOverNL80211=true

[Network]
RoutePriorityOffset=200

NameResolvingService=systemd
EnableIPv6=true


[Scan]
MaximumPeriodicScanInterval=30

# The Miyoo Flip V2 RTL8733BU FullMAC driver advertises external SAE support,
# but cannot complete WPA3 authentication. Prefer WPA2 on transition-mode
# networks; WPA3-only networks remain unavailable on this adapter.
[DriverQuirks]
SaeDisable=rtl8733bu
