context.properties = {
    default.clock.power-of-two-quantum = true
    # At 48 kHz, 1024-sample cycles take 21.3 ms. With RetroArch's
    # 32 ms audio buffer they stall 60 Hz emulation at roughly 47 FPS.
    # Keep cycles below one video frame while retaining power-of-two sizing.
    default.clock.quantum = 512
    default.clock.min-quantum = 512
    default.clock.max-quantum = 512
}
